<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Seatwork 1: Atlas of Southeast Asia</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <div class="container p-4 mt-5 mb-5 rounded bg-white">

            <div class="text-center">
                <h1>The Atlas of Southeast Asia</h1> <hr><br>
            </div>

            <div class="row">

                <!--Country Names-->
                <div>
                    <label for="countries">Enter a Southeast Asian Country</label> <br>
                    <input type="text" class="form-control w-100" id="generate_nickname" placeholder="Enter a Country">  <br>
                </div>

                <!--Buttons-->
                <div>
                    <button type="button" class="btn btn-success mt-3" py-click="generate_nickname">Reveal Nickname</button>
                    <div id="result"></div>
                </div>

            </div>
        </div>
    </form>

    <py-script src="main.py"></py-script>

</body>
</html>
